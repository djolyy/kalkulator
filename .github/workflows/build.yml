name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Prevajanje
        run: make

      - name: Test
        run: echo "3 + 4" | ./build/kalkulator | grep "= 7"
